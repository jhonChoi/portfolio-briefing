<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>포트폴리오 브리핑</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#18181b;--dim:#71717a;--line:#e4e4e7}
@media(prefers-color-scheme:dark){:root{--bg:#0c0c0e;--fg:#ededf0;--dim:#8b8b94;--line:#26262b}}
body{margin:0;padding:60px 20px;background:var(--bg);color:var(--fg);
 font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
 line-height:1.7;display:flex;align-items:center;justify-content:center;min-height:70vh}
.box{max-width:460px;text-align:center}
h1{font-size:1.4rem;margin:0 0 12px}
p{color:var(--dim);margin:8px 0}
code{background:var(--line);padding:2px 7px;border-radius:5px;font-size:.88rem}
</style>
</head>
<body>
<div class="box">
  <h1>포트폴리오 브리핑</h1>
  <p>아직 첫 브리핑이 발행되지 않았습니다.</p>
  <p>Actions 탭에서 <code>Daily Portfolio Briefing</code> 을<br>수동 실행하면 이 페이지가 교체됩니다.</p>
</div>
</body>
</html>
