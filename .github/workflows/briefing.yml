name: Daily Portfolio Briefing

# ─────────────────────────────────────────────────────────────
#  실행 시각 주의: GitHub Actions cron은 UTC 기준입니다.
#  KST 07:00 = UTC 22:00 (전날)
#  KST 월~금 아침  =  UTC 일~목 밤  =  0-4
#  → "0 22 * * 0-4"
#
#  GitHub Actions 예약 실행은 5~30분 지연될 수 있고,
#  드물게 스킵될 수 있습니다. 정시성이 중요하면 06:40에 걸어두세요.
# ─────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "0 22 * * 0-4"
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write           # docs/ 커밋 + keepalive

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: 1. 시세 수집 + 거래일 검증
        id: quotes
        run: python scripts/fetch_quotes.py
        # 실패 시 여기서 중단 — 틀린 데이터를 보내는 것보다 안 보내는 게 낫다

      - name: 2. 뉴스 수집
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python scripts/fetch_news.py

      - name: 3. 브리핑 생성 (Claude API)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/build_briefing.py

      - name: 4. GitHub Pages 발행
        run: |
          python scripts/publish.py
          git config user.name  "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "브리핑 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push

      - name: 5. 카카오톡 발송
        env:
          KAKAO_REST_API_KEY:  ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_PAT:              ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY:   ${{ github.repository }}
          PAGES_BASE:          ${{ vars.PAGES_BASE }}
        run: python scripts/kakao_send.py

      # 실패해도 조용히 넘어가지 않기
      - name: 실패 알림
        if: failure()
        env:
          KAKAO_REST_API_KEY:  ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/kakao_send.py --failure
        continue-on-error: true
